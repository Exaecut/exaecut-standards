id: ts-no-empty-catch-tsx
valid:
  - |
    try {
      run();
    } catch (error) {
      throw error;
    }
  - |
    try {
      run();
    } catch {
      /* best effort: shutdown is already in progress */
    }
invalid:
  - |
    try {
      run();
    } catch (error) {}
  - |
    try {
      run();
    } catch {}
